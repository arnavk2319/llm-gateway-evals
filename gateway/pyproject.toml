[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway: role-aware routing, tracing, and evals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "psycopg[binary,pool]>=3.2",
  "sentry-sdk>=2.75.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["bench"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I imports, B bugbear, UP modernization, S security (bandit rules),
# ASYNC blocking calls in async code, SIM simplifications, RUF misc.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "B008", "S101", "RUF012", "SIM105", "SIM108", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "RUF", "SIM", "E741"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app"]
