# Seed routing policy (phase 1: hand-written; phase 3: the control plane proposes new versions).
#
# Real model ids and list prices below are examples and change over time.
# Verify them against each provider's docs before relying on them.

version: 1
status: active

providers:
  mock:
    kind: mock
    disabled_if_env: [GATEWAY_DISABLE_MOCK]
  ollama:
    kind: openai_compat
    base_url: http://localhost:11434/v1
    requires_env: [OLLAMA_ENABLED]
  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    api_key_env_secondary: GROQ_API_KEY_2   # optional: rotation / failover
    requires_env: [GROQ_API_KEY]
  openrouter:
    # Free-tier models are served by third parties that may log or train on prompts, so sensitive
    # requests (see `safety` below) are never sent here. Verify the terms before changing this.
    sensitive_ok: false
    # Only endpoints OpenRouter classifies as not storing or training on prompts. A model with no such endpoint
    # answers 404, which the router treats as "unavailable" and falls back. Check with scripts/probe_openrouter.py.
    request_extra:
      provider: {data_collection: deny}
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    api_key_env_secondary: OPENROUTER_API_KEY_2
    requires_env: [OPENROUTER_API_KEY]

models:
  # --- mock models: always available, deterministic, used by tests and demos
  - id: mock/small
    provider: mock
    model: mock-small
    family: mock-a
    tier: 1
    capabilities: {tools: true, json_mode: true, max_context: 16000}
    price: {input_per_1m: 0.05, output_per_1m: 0.10}
    latency_ms_p50: 300
    quality: {default: 0.55, code: 0.45, extraction: 0.60}
  - id: mock/medium
    provider: mock
    model: mock-medium
    family: mock-b
    tier: 2
    capabilities: {tools: true, json_mode: true, max_context: 32000}
    price: {input_per_1m: 0.30, output_per_1m: 0.60}
    latency_ms_p50: 800
    quality: {default: 0.72, code: 0.70, review: 0.74}
  - id: mock/large
    provider: mock
    model: mock-large
    family: mock-c
    tier: 3
    capabilities: {tools: true, json_mode: true, max_context: 64000}
    price: {input_per_1m: 1.00, output_per_1m: 2.00}
    latency_ms_p50: 1800
    quality: {default: 0.88, code: 0.90, review: 0.90}

  # --- open models (free tiers / local). Billed cost is 0; shadow cost uses list price.
  - id: ollama/llama3.2-3b
    provider: ollama
    model: "llama3.2:3b"
    family: llama
    tier: 1
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 8000}
    price: {input_per_1m: 0.05, output_per_1m: 0.08}
    latency_ms_p50: 1500
    quality: {default: 0.50, code: 0.45}
  - id: ollama/qwen2.5-7b
    provider: ollama
    model: "qwen2.5:7b"
    family: qwen
    tier: 2
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 16000}
    price: {input_per_1m: 0.10, output_per_1m: 0.15}
    latency_ms_p50: 3000
    quality: {default: 0.65, code: 0.70}
  # Groq: only the gpt-oss models are on this account's plan. Prices are list prices; verify on console.groq.com.
  - id: groq/gpt-oss-20b
    provider: groq
    model: openai/gpt-oss-20b
    family: gpt-oss
    tier: 2
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 131072}
    price: {input_per_1m: 0.075, output_per_1m: 0.30}
    latency_ms_p50: 400
    quality: {default: 0.70, code: 0.68}
  - id: groq/gpt-oss-120b
    provider: groq
    model: openai/gpt-oss-120b
    family: gpt-oss
    tier: 3
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 131072}
    price: {input_per_1m: 0.15, output_per_1m: 0.75}
    latency_ms_p50: 700
    quality: {default: 0.85, code: 0.84, review: 0.85}
  # Preview on Groq: it may be withdrawn at short notice, so it must never be the only model in its tier.
  - id: groq/qwen3.8-27b
    provider: groq
    model: qwen/qwen3.8-27b
    family: qwen
    tier: 2
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 131072}
    price: {input_per_1m: 0.80, output_per_1m: 4.00}
    latency_ms_p50: 900
    quality: {default: 0.78, code: 0.80, review: 0.78}
  # OpenRouter free models: list price is zero, so billed and shadow cost are both 0. Probed 2026-11-19 with
  # scripts/probe_openrouter.py under data_collection=deny: every Nvidia Nemotron free model, Liquid LFM 3 and Particle-1
  # have no endpoint that avoids training, so they are left out; Gemma 4 answered 429 (upstream rate limit, so an
  # endpoint exists). Re-run the probe before adding or keeping a model. Quality scores are estimates.
  - id: openrouter/gemma-4-31b
    provider: openrouter
    model: "google/gemma-4-31b-it:free"
    family: gemma
    tier: 3
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 262144}
    price: {input_per_1m: 0.0, output_per_1m: 0.0}
    latency_ms_p50: 1500
    quality: {default: 0.80, code: 0.78, review: 0.80}
  - id: openrouter/gemma-4-26b
    provider: openrouter
    model: "google/gemma-4-26b-a4b-it:free"
    family: gemma
    tier: 2
    free: true
    capabilities: {tools: true, json_mode: true, max_context: 262144}
    price: {input_per_1m: 0.0, output_per_1m: 0.0}
    latency_ms_p50: 1200
    quality: {default: 0.72, code: 0.70}

task_policies:
  default: {min_tier: 1}
  chat: {min_tier: 1}
  classification: {min_tier: 1}
  extraction: {min_tier: 1}
  summarization: {min_tier: 1}
  code: {min_tier: 2}
  agent_tool: {min_tier: 2}
  review: {min_tier: 2}

role_constraints:
  reviewer: {independence: family}

weights: {cost: 0.30, latency: 0.15, quality: 0.55}

retry:
  max_attempts: 3
  deadline_s: 30
  per_attempt_timeout_s: 20
  first_token_timeout_s: 15

# The safety gate: checked before a provider is called and again on the reply (replies are not checked when streamed).
safety:
  enabled: true
  input:
    secrets: redact      # block | redact | allow: API keys, private keys, connection strings
    pii: sensitive       # sensitive | redact | block | allow: email, card number, SSN; "sensitive" limits the request to providers with sensitive_ok
    injection: defang    # defang | warn | block | allow: override phrases, chat-template tokens and hidden characters become inert text (a heuristic)
  output:
    leaked_secrets: redact   # redact | fallback | allow
    empty: fallback          # fallback | allow: a reply with no text and no tool call
    markup: defang           # defang | allow: script-like HTML, javascript: links and auto-fetching images are made inert (code blocks are left alone)
    tool_calls: declared_only  # declared_only | allow: a reply may only call tools the request declared

llm_classify:
  enabled: false
  threshold: 0.7
  model: mock/small
  timeout_s: 3
