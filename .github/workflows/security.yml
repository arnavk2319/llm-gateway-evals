name: security

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly published advisories
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check: secrets. Scans the whole history for committed credentials.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required check: sast. Static analysis for injection, unsafe deserialization, SSRF, XSS and similar.
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install "semgrep==1.*"
      - run: >-
          semgrep scan --error --quiet
          --config p/default --config p/python --config p/typescript --config p/nextjs
          --config p/secrets --config p/owasp-top-ten
          gateway/app gateway/scripts dashboard/app dashboard/lib

  # Required check: dependency-audit. Known vulnerabilities in locked dependencies.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: pip-audit (gateway)
        working-directory: gateway
        run: |
          uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements-audit.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements-audit.txt
      - name: npm audit (dashboard)
        working-directory: dashboard
        run: npm audit --audit-level=high

  # Pull requests only: block newly introduced vulnerable or disallowed-licence dependencies.
  # Needs "Dependency graph" enabled (Settings > Advanced Security). Until then it cannot run,
  # so it is advisory; remove continue-on-error once the graph is on.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # CodeQL: deeper dataflow analysis (taint tracking) than pattern-based SAST.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with: { category: "/language:${{ matrix.language }}" }

  # Required check: workflow-security. Lints these workflows for injection and over-broad permissions.
  workflow-security:
    name: workflow-security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uvx zizmor --min-severity medium .github
